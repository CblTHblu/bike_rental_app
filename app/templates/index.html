{% extends "base.html" %}
{% block content %}
<h1>Таблицы базы данных</h1>
<p>Выберите таблицу, чтобы посмотреть, добавить, изменить или удалить записи.</p>
<div class="cards">
  {% for key, tbl in tables.items() %}
    <a class="card" href="{{ url_for('listing', name=key) }}">
      <span class="card-title">{{ tbl.title }}</span>
      <span class="card-count">записей: {{ counts[key] }}</span>
    </a>
  {% endfor %}
</div>
{% endblock %}
